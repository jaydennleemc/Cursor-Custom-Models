name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - label: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - label: Windows
            platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: macOS signing identity
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
          else
            # Same as freeway-desktop: ad-hoc sign without a paid Developer ID.
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cursor Gateway ${{ github.ref_name }}
          releaseBody: See the assets to download this version and install.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # freeway-desktop: codesign --sign - , strip quarantine, then hdiutil DMG.
      # Tauri's default unsigned DMG is what Gatekeeper calls "damaged".
      - name: Ad-hoc sign and rebuild macOS DMG
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Developer ID certificate present; keeping Tauri-signed DMG"
            exit 0
          fi

          APP="$(find src-tauri/target -path '*/bundle/macos/*.app' -type d | head -1)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "❌ .app not found under src-tauri/target/**/bundle/macos"
            find src-tauri/target -path '*/bundle/macos/*' -maxdepth 3 | head -50 || true
            exit 1
          fi
          echo "Using app: $APP"

          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          xattr -cr "$APP"

          VERSION=$(node -p "require('./package.json').version")
          ARCH="aarch64"
          case "${{ matrix.args }}" in
            *x86_64*) ARCH="x86_64" ;;
          esac

          mkdir -p dist-release
          STAGING="dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          xattr -cr "$STAGING"

          DMG="dist-release/Cursor-Gateway-${VERSION}-${ARCH}.dmg"
          rm -f "$DMG"
          hdiutil create \
            -volname "Cursor Gateway" \
            -fs HFS+ \
            -srcfolder "$STAGING" \
            -ov -format UDBZ \
            "$DMG"

          ZIP="dist-release/Cursor-Gateway-${VERSION}-${ARCH}.zip"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

          ls -lh dist-release/

          gh release upload "$TAG" "$DMG" "$ZIP" --clobber

          # Drop Tauri's original DMG (spaces in the filename; unsigned/quarantined).
          TAURI_DMG="$(find src-tauri/target -path '*/bundle/dmg/*.dmg' | head -1 || true)"
          if [ -n "$TAURI_DMG" ]; then
            gh release delete-asset "$TAG" "$(basename "$TAURI_DMG")" --yes || true
          fi
