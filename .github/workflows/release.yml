name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  version-check:
    name: Tag matches package versions
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Verify tag equals package.json / tauri.conf.json / Cargo.toml
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(awk '/^\[package\]/{f=1} f && /^version = /{sub(/^version = /,""); gsub(/"/,""); print; exit}' src-tauri/Cargo.toml)
          echo "tag=$TAG  package.json=$PKG  tauri.conf.json=$TAURI  Cargo.toml=$CARGO"
          fail=0
          for pair in "package.json:$PKG" "tauri.conf.json:$TAURI" "Cargo.toml:$CARGO"; do
            name="${pair%%:*}"
            ver="${pair#*:}"
            if [ "$ver" != "$TAG" ]; then
              echo "❌ $name version ($ver) != tag ($TAG)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Bump every version location to $TAG before tagging, or the updater will serve a mismatched latest.json."
            exit 1
          fi

  publish:
    name: ${{ matrix.label }}
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM
            platform: macos-latest
            args: --config src-tauri/tauri.release.json --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - label: macOS Intel
            platform: macos-latest
            args: --config src-tauri/tauri.release.json --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - label: Windows
            platform: windows-latest
            args: --config src-tauri/tauri.release.json
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Do not pass empty APPLE_CERTIFICATE: Tauri still tries `security import` and fails.
      # Same as freeway-desktop: ad-hoc identity "-" and no keychain cert.
      # tauri-action@v0 picks pnpm if pnpm-lock.yaml is present. This repo is npm
      # (package-lock.json); do not commit a pnpm lockfile or Windows CI dies with
      # "'pnpm' is not recognized" (v1.0.7 first attempt).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cursor Gateway ${{ github.ref_name }}
          releaseBody: See the assets to download this version and install.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 5
          args: ${{ matrix.args }}

      # freeway-desktop: codesign --sign - , strip quarantine, then hdiutil DMG.
      - name: Ad-hoc sign and rebuild macOS DMG
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          APP="$(find src-tauri/target -type d -name '*.app' | grep '/bundle/macos/' | head -1)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "❌ .app not found under src-tauri/target/**/bundle/macos"
            find src-tauri/target -path '*/bundle/macos/*' -maxdepth 3 | head -50 || true
            exit 1
          fi
          echo "Using app: $APP"

          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          xattr -cr "$APP"

          VERSION=$(node -p "require('./package.json').version")
          ARCH="aarch64"
          case "${{ matrix.args }}" in
            *x86_64*) ARCH="x86_64" ;;
          esac

          mkdir -p dist-release
          STAGING="dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          xattr -cr "$STAGING"

          DMG="dist-release/Cursor-Gateway-${VERSION}-${ARCH}.dmg"
          rm -f "$DMG"
          hdiutil create \
            -volname "Cursor Gateway" \
            -fs HFS+ \
            -srcfolder "$STAGING" \
            -ov -format UDBZ \
            "$DMG"

          ZIP="dist-release/Cursor-Gateway-${VERSION}-${ARCH}.zip"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

          ls -lh dist-release/

          gh release upload "$TAG" "$DMG" "$ZIP" --clobber

          # Drop Tauri's original DMG (spaces in the filename; unsigned/quarantined).
          TAURI_DMG="$(find src-tauri/target -path '*/bundle/dmg/*.dmg' | head -1 || true)"
          if [ -n "$TAURI_DMG" ]; then
            gh release delete-asset "$TAG" "$(basename "$TAURI_DMG")" --yes || true
          fi

  updater-manifest:
    name: Check updater manifest
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # The publish jobs already uploaded the release; a failed check must not
    # turn the whole release run red (v1.0.9/v1.0.10 looked "failed" while
    # their assets were fine).
    continue-on-error: true
    steps:
      - name: Require every platform in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          gh release download "$TAG" -R "${{ github.repository }}" --pattern latest.json --dir dist-release --clobber
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("dist-release/latest.json", "utf8"));
            const keys = Object.keys(manifest.platforms ?? {});
            const need = ["darwin-aarch64", "darwin-x86_64"];
            const missing = need.filter((key) => !keys.includes(key));
            if (!keys.some((key) => key.startsWith("windows-x86_64"))) missing.push("windows-x86_64");
            console.log("platforms:", keys.join(", ") || "(none)");
            console.log("version:", manifest.version);
            if (missing.length) {
              console.error("latest.json is missing: " + missing.join(", "));
              process.exit(1);
            }
          '
