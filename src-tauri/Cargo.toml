[package]
name = "cursor-custom-models"
version = "1.0.7",
description = "Cursor Custom Models — desktop app Cursor Gateway"
authors = ["Cursor Custom Models"]
edition = "2021"
license = "MIT"
default-run = "cursor-gateway"

[lib]
name = "cursor_custom_model_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cursor-gateway"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
dirs = "6"
thiserror = "2"
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
